- type: Modules
  data:
  - name: Shopping Experience
    description: Optimize delivery options during checkout with dynamic slots and
      on-demand options.
  - name: Plan
    description: Resource management and route optimization across fleets, including
      continuous route optimization and carrier selection.
  - name: Dispatch
    description: Single-pane monitoring of order progress with real-time fleet visibility,
      exception handling, and automated dispatch.
  - name: Drive
    description: iOS and Android driver applications with customized workflows, task
      management, and geofence-powered delivery visibility.
  - name: Delivery Experience
    description: Customer-facing notifications, tracking, ETAs, and branded communication
      throughout the delivery process.
  - name: Automation Center
    description: No-code workflow automation across the Bringg platform.
  - name: Intelligence
    description: Dashboards, reporting, and insights on cost, profit, and driver performance.
  - name: Connect
    description: REST APIs, webhooks, and integrations with OMS, ERP, eCommerce, WMS,
      and TMS systems plus the Bringg Carrier Network.
- type: Solutions
  data:
  - name: Retail Same-Day Delivery
    description: Enable same-day, scheduled, and curbside fulfillment for enterprise
      retailers.
  - name: Returns
    description: Orchestrate return pickups and reverse logistics.
  - name: Carrier Network Access
    description: Plug into 250+ pre-integrated third-party fleets through a single
      integration.
  - name: Driver Productivity
    description: Equip drivers with the Bringg Driver App, optimized routes, and geofence-aware
      workflows.
